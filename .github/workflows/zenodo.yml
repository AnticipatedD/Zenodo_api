name: Publish to Zenodo
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Upload release to Zenodo
        run: |
          python upload_to_zenodo.py \
            --token ${{ secrets.ZENODO_ACCESS_TOKEN }} \
            --file ./dist/release.tar.gz \
            --metadata metadata.json
